<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koffie in Rotterdam — 10 tips voor het centrum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f6efe6;
    --cream-2:#efe4d5;
    --card:#fffdf9;
    --ink:#2c2018;
    --muted:#7a6a5c;
    --brown:#5c3d2c;
    --terracotta:#c56b46;
    --terracotta-dark:#a9542f;
    --gold:#d9a441;
    --line:rgba(92,61,44,.14);
    --shadow:0 1px 2px rgba(60,40,25,.06),0 8px 24px rgba(60,40,25,.08);
    --shadow-hover:0 4px 10px rgba(60,40,25,.10),0 18px 40px rgba(60,40,25,.16);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, var(--cream-2), transparent 60%),
      var(--cream);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}

  /* ---------- header ---------- */
  header{padding:64px 0 12px;text-align:center}
  .kicker{
    display:inline-block;
    font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:.72rem;color:var(--terracotta-dark);
    background:rgba(197,107,70,.12);
    padding:6px 14px;border-radius:999px;margin-bottom:18px;
  }
  h1{
    font-family:"Fraunces",Georgia,serif;
    font-weight:600;
    font-size:clamp(2.2rem,6vw,3.6rem);
    line-height:1.02;letter-spacing:-.02em;
    margin:0 0 14px;
  }
  h1 .accent{color:var(--terracotta)}
  .lede{
    max-width:560px;margin:0 auto;
    color:var(--muted);font-size:1.05rem;
  }
  .steam{font-size:2.2rem;line-height:1;display:block;margin-bottom:10px}

  /* ---------- grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
    padding:44px 0 24px;
  }
  .card{
    position:relative;
    display:flex;flex-direction:column;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 22px 20px;
    text-decoration:none;color:inherit;
    box-shadow:var(--shadow);
    transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;height:100%;width:4px;
    background:linear-gradient(var(--terracotta),var(--gold));
    opacity:0;transition:opacity .22s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-hover);
    border-color:rgba(197,107,70,.35);
  }
  .card:hover::before{opacity:1}
  .card:focus-visible{outline:3px solid var(--terracotta);outline-offset:3px}

  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
  .num{
    flex:none;
    font-family:"Fraunces",serif;font-weight:600;
    font-size:.95rem;color:var(--terracotta);
    width:30px;height:30px;border-radius:50%;
    display:grid;place-items:center;
    background:rgba(197,107,70,.1);
  }
  .rating{
    flex:none;display:flex;align-items:center;gap:5px;
    font-weight:600;font-size:.85rem;color:var(--brown);
    background:var(--cream);border:1px solid var(--line);
    padding:4px 9px;border-radius:999px;white-space:nowrap;
  }
  .rating .stars{color:var(--gold);letter-spacing:1px;font-size:.8rem}

  .name{
    font-family:"Fraunces",serif;font-weight:600;
    font-size:1.32rem;line-height:1.12;margin:2px 0 8px;
  }
  .tip{color:var(--ink);font-size:.95rem;margin:0 0 16px;flex:1}
  .addr{
    display:flex;align-items:center;gap:8px;
    color:var(--muted);font-size:.86rem;
    padding-top:14px;border-top:1px dashed var(--line);
  }
  .addr .pin{flex:none;color:var(--terracotta)}
  .maps-hint{
    margin-left:auto;font-size:.78rem;font-weight:600;
    color:var(--terracotta-dark);
    opacity:0;transform:translateX(-4px);
    transition:opacity .22s ease,transform .22s ease;
    white-space:nowrap;
  }
  .card:hover .maps-hint{opacity:1;transform:none}

  /* ---------- footer ---------- */
  footer{
    text-align:center;color:var(--muted);font-size:.85rem;
    padding:20px 0 60px;
  }
  footer .divider{
    width:60px;height:3px;border-radius:3px;margin:0 auto 20px;
    background:linear-gradient(90deg,var(--terracotta),var(--gold));
  }

  @media (max-width:520px){
    header{padding:44px 0 8px}
    .grid{gap:16px;padding:32px 0 16px}
    .maps-hint{opacity:1;transform:none}
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <span class="steam" aria-hidden="true">☕</span>
      <span class="kicker">Rotterdam · Centrum</span>
      <h1>10 fijne <span class="accent">koffiezaken</span></h1>
      <p class="lede">Een kort en gezellig lijstje voor in het centrum. Tik op een kaart om de zaak in Google Maps te openen.</p>
    </div>
  </header>

  <main class="wrap">
    <div class="grid" id="grid" aria-label="Lijst met koffiezaken"></div>
  </main>

  <footer>
    <div class="wrap">
      <div class="divider" aria-hidden="true"></div>
      Gemaakt met veel cafeïne · sfeerbeschrijvingen zijn subjectief
    </div>
  </footer>

  <script>
    const shops = [
      { name:"Cafecito Coffee Bar", tip:"Populair specialty koffieplekje, vaak een wachtrij.", addr:"Meent 52", rating:4.5 },
      { name:"Café Van Zanten", tip:"Groot terras, vaak lekker druk.", addr:"Meent 44", rating:4.2 },
      { name:"NEIGHBORHOOD", tip:"Trendy en levendig, terras midden in het centrum.", addr:"Herenplaats 1", rating:4.3 },
      { name:"Booon", tip:"Gezellige drukte, binnen én buiten zitten.", addr:"Proveniersstraat 31", rating:4.4 },
      { name:"Man met bril koffie", tip:"Populair, vaak lekker vol.", addr:"Vijverhofstraat 70", rating:4.5 },
      { name:"Amada Coffee", tip:"Sfeervol en gezellig druk, in de Oude Haven-buurt.", addr:"Hoogstraat 36a", rating:4.6 },
      { name:"Harvest", tip:"Populaire bakery-cafe, vaak een wachtrij.", addr:"Glashaven 105-107", rating:4.6 },
      { name:"Coffee Company Eendrachtsplein", tip:"Levendige locatie op het plein.", addr:"Eendrachtsplein 2", rating:4.2 },
      { name:"Hotel âme", tip:"Sfeervol hotelcafé met Japandi-interieur — populair voor koffie/matcha en werken.", addr:"Eendrachtsweg 19", rating:4.5 },
      { name:"Round&Round", tip:"Matcha- en cakezaak, gezellig druk (let op: open vanaf 12:00).", addr:"Hoogstraat 55A", rating:4.4 },
    ];

    // 5-sterren rij op basis van rating (halve ster afgerond)
    function stars(r){
      const full = Math.round(r);
      return "★".repeat(full) + "☆".repeat(5 - full);
    }

    function mapsUrl(name, addr){
      const q = encodeURIComponent(`${name}, ${addr}, Rotterdam`);
      return `https://www.google.com/maps/search/?api=1&query=${q}`;
    }

    const grid = document.getElementById("grid");
    grid.innerHTML = shops.map((s, i) => `
      <a class="card" href="${mapsUrl(s.name, s.addr)}" target="_blank" rel="noopener"
         aria-label="${s.name}, ${s.addr}, beoordeling ${s.rating} van 5">
        <div class="card-top">
          <span class="num">${i + 1}</span>
          <span class="rating"><span class="stars" aria-hidden="true">${stars(s.rating)}</span>${s.rating.toFixed(1)}</span>
        </div>
        <h2 class="name">${s.name}</h2>
        <p class="tip">${s.tip}</p>
        <div class="addr">
          <span class="pin" aria-hidden="true">📍</span>
          <span>${s.addr}</span>
          <span class="maps-hint">Open in Maps →</span>
        </div>
      </a>
    `).join("");
  </script>
</body>
</html>
