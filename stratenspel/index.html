<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Stratenspel: het klassieke Nederlandse vastgoed-bordspel in de browser, samen of tegen de computer.">
<title>Stratenspel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: bord links zo groot mogelijk, zijpaneel rechts; onder 1024px bord bovenaan met vaste actiebalk */
:root{
  --page:#F4F6F3; --surface:#FFFFFF; --tile:#FBFCFA; --tile2:#EEF3EF; --line:#DCE3DF;
  --felt:#1E3B36; --felt2:#2D5A51; --jail:#F8E2CB;
  --fg:#1B2422; --muted:#5C6B66; --accent:#1F7A5C; --accent-fg:#FFFFFF; --accent-soft:#E1F0E8;
  --pos:#1A7F4B; --neg:#C93C3C; --scrim:rgba(12,24,21,.42); --toast:#1B2422; --toast-fg:#F4F6F3;
  --g-bruin:#8C5A3C; --g-lichtblauw:#7CC6E8; --g-roze:#D6589C; --g-oranje:#F28C38; --g-rood:#E04848; --g-geel:#F2C531; --g-groen:#2EA66B; --g-donkerblauw:#2F5DA8;
  --chance:#F2994A; --chest:#4A7FC1; --station:#3A4744; --station-t:#FFFFFF; --utility:#2A9D8F; --house:#2EA66B; --hotel:#E04848;
  --shadow:0 18px 40px rgba(20,45,38,.16); --shadow-s:0 2px 10px rgba(20,45,38,.10);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#111816; --surface:#18211E; --tile:#1E2926; --tile2:#162020; --line:#2A3632;
    --felt:#09110F; --felt2:#173129; --jail:#3D2F22;
    --fg:#E6EEEA; --muted:#9AABA4; --accent:#4CC79A; --accent-fg:#0D1512; --accent-soft:#1C3A2F;
    --pos:#5FD3A4; --neg:#F07A7A; --scrim:rgba(0,0,0,.55); --toast:#E6EEEA; --toast-fg:#111816;
    --g-bruin:#B07650; --g-lichtblauw:#8DD2F0; --g-roze:#E36AAB; --g-oranje:#F79A4B; --g-rood:#EC5C5C; --g-geel:#F5CE45; --g-groen:#3BBE7C; --g-donkerblauw:#4E80D6;
    --station:#B8C6C1; --station-t:#111816;
    --shadow:0 18px 40px rgba(0,0,0,.45); --shadow-s:0 2px 10px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#111816; --surface:#18211E; --tile:#1E2926; --tile2:#162020; --line:#2A3632;
  --felt:#09110F; --felt2:#173129; --jail:#3D2F22;
  --fg:#E6EEEA; --muted:#9AABA4; --accent:#4CC79A; --accent-fg:#0D1512; --accent-soft:#1C3A2F;
  --pos:#5FD3A4; --neg:#F07A7A; --scrim:rgba(0,0,0,.55); --toast:#E6EEEA; --toast-fg:#111816;
  --g-bruin:#B07650; --g-lichtblauw:#8DD2F0; --g-roze:#E36AAB; --g-oranje:#F79A4B; --g-rood:#EC5C5C; --g-geel:#F5CE45; --g-groen:#3BBE7C; --g-donkerblauw:#4E80D6;
  --station:#B8C6C1; --station-t:#111816;
  --shadow:0 18px 40px rgba(0,0,0,.45); --shadow-s:0 2px 10px rgba(0,0,0,.35);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:8px}
.eyebrow .pawn{width:20px;height:20px}
.ico{width:20px;height:20px;flex:none}
.pawn{display:block;flex:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Knoppen */
.btn{min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,border-color .15s,background .15s;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;box-shadow:0 6px 16px -6px var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{min-height:52px;font-size:16px;padding:12px 20px}
.btn.s{min-height:40px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.light{background:#fff;color:#1B2422;border-color:transparent}
.btn.is-disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.iconbtn:focus-visible,.tile:focus-visible,.pc:focus-visible,.chip:focus-visible,.mode:focus-visible,.pawnbtn:focus-visible,.seg button:focus-visible,.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn .ico{width:18px;height:18px}
.iconbtn{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 10px;font-weight:600;font-size:14px}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btns .btn{flex:1 1 auto}
.inp{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--tile);color:var(--fg);width:100%}
.inp:focus{outline:2px solid var(--accent);outline-offset:0}

/* ---------- Startscherm ---------- */
#setup{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:grid;gap:22px}
.hero{position:relative;border-radius:26px;overflow:hidden;background:radial-gradient(120% 120% at 15% 10%,var(--felt2),var(--felt));color:#F2F7F4;padding:44px 32px;min-height:280px;display:flex;align-items:center}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.035) 46px 48px);pointer-events:none}
.hero-txt{position:relative;z-index:1;max-width:520px}
.hero h1{font-size:clamp(46px,9vw,92px);font-weight:800;line-height:.92;letter-spacing:-.03em}
.hero .lede{font-size:17px;opacity:.86;margin:14px 0 0;max-width:44ch}
.hero .eyebrow{color:#BFE3D2}
.strip8{display:flex;gap:4px;margin-top:22px}
.strip8 i{width:26px;height:8px;border-radius:3px}
.fdecks{position:absolute;right:4%;top:50%;width:330px;height:240px;transform:translateY(-50%)}
.fdeed{position:absolute;width:132px;border-radius:12px;background:#FBFCFA;color:#1B2422;box-shadow:0 18px 30px rgba(0,0,0,.35);overflow:hidden;animation:floaty 7s ease-in-out infinite}
.fdeed:nth-child(1){left:0;top:40px;--r:-10deg}
.fdeed:nth-child(2){left:98px;top:0;--r:4deg;animation-delay:-2.3s}
.fdeed:nth-child(3){left:196px;top:58px;--r:12deg;animation-delay:-4.6s}
.fd-h{padding:12px 10px;text-align:center}
.fd-h small{display:block;font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.fd-h b{display:block;font-family:var(--display);font-size:16px;line-height:1.1;margin-top:2px}
.fd-h span{font-size:10px;opacity:.85}
.fd-b{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 12px 12px;font-size:11px}
.fd-b span:nth-child(even){font-family:var(--mono)}
@keyframes floaty{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(var(--r)) translateY(-10px)}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mode{text-align:left;padding:22px;border-radius:20px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;grid-template-columns:52px 1fr;gap:4px 16px;align-items:start;transition:border-color .15s,box-shadow .15s,transform .15s}
.mode:hover{transform:translateY(-2px);box-shadow:var(--shadow-s)}
.mode .mi{grid-row:span 2;width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mode .mi .ico{width:28px;height:28px}
.mode h3{font-size:22px;font-weight:700}
.mode p{margin:0;color:var(--muted)}
.mode.sel{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.links{display:flex;flex-wrap:wrap;gap:10px}
.config{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:16px}
.tabs{display:inline-flex;background:var(--tile2);border-radius:12px;padding:4px;gap:4px;justify-self:start}
.tabs button{border:0;background:transparent;border-radius:9px;min-height:40px;padding:0 16px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-s)}
.plist{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:48px minmax(0,1fr) auto minmax(120px,auto) 44px;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--tile)}
.pawnbtn{width:48px;height:48px;border:0;background:transparent;padding:0;cursor:pointer;border-radius:50%}
.pawnbtn .pawn{width:44px;height:44px;margin:2px;transition:transform .2s}
.pawnbtn:hover .pawn{transform:rotate(-12deg) scale(1.06)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{min-height:42px;padding:0 12px;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.cfg-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.cfg-foot p{margin:0;min-width:0}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow label{display:grid;gap:2px;min-width:0}
.setrow label span{font-size:13px;color:var(--muted)}
.setrow .inp{width:auto;min-width:130px}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}
.switch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- Spelscherm ---------- */
#game{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,370px);grid-template-rows:auto 1fr;grid-template-areas:"top top" "board side";gap:12px 22px;padding-inline:16px;padding-block:0 16px;min-height:100%}
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin-right:auto}
.brand i{width:28px;height:28px;border-radius:8px;background:conic-gradient(var(--g-rood) 0 25%,var(--g-geel) 0 50%,var(--g-groen) 0 75%,var(--g-donkerblauw) 0);display:block;transform:rotate(45deg) scale(.8)}
.tinfo{font-family:var(--mono);font-size:13px;color:var(--muted);padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}
.chips{grid-area:chips;display:none}
.boardArea{grid-area:board;min-width:0;display:flex;justify-content:center;align-items:flex-start}
.side{grid-area:side;display:flex;flex-direction:column;gap:12px;min-width:0}

/* Bord */
.board{position:relative;width:var(--size,620px);height:var(--size,620px);padding:var(--pad,8px);border-radius:22px;background:radial-gradient(110% 90% at 50% 38%,var(--felt2),var(--felt));box-shadow:var(--shadow);flex:none}
.grid{display:grid;grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;gap:2px;width:100%;height:100%}
.tile{position:relative;background:var(--tile);border-radius:5px;overflow:hidden;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,opacity .2s;outline:none}
.tile:hover{transform:scale(1.04);z-index:4;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.in{position:absolute;left:50%;top:50%;width:var(--c);height:var(--k);transform:translate(-50%,-50%) rotate(var(--rot,0deg));display:flex;flex-direction:column;align-items:center;text-align:center}
.s-l{--rot:90deg}.s-t{--rot:180deg}.s-r{--rot:-90deg}
.bar{flex:0 0 22%;width:100%;display:flex;align-items:center;justify-content:center;border-radius:4px 4px 0 0}
.bld{display:flex;gap:1px;align-items:center;justify-content:center;height:74%}
.bld svg{height:100%;width:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.bld svg.drop{animation:drop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{0%{transform:translateY(-140%);opacity:0}100%{transform:none;opacity:1}}
.nm{font-weight:700;font-size:max(6px,calc(var(--c)*.128));line-height:1.08;letter-spacing:.02em;text-transform:uppercase;padding:0 3px;margin-top:9%;overflow-wrap:break-word;hyphens:manual;max-width:100%}
.nm.top{margin-top:11%}
.city{font-size:max(5px,calc(var(--c)*.098));color:var(--muted);margin-top:3%}
.pr{margin-top:auto;margin-bottom:12%;font-family:var(--mono);font-weight:600;font-size:max(6px,calc(var(--c)*.118))}
.ic{width:calc(var(--c)*.5);height:calc(var(--c)*.5);margin-top:auto;color:var(--station)}
.ic svg{width:100%;height:100%}
.ic.big{width:calc(var(--c)*.66);height:calc(var(--c)*.66);margin-block:auto 22%}
.ic.ch{color:var(--chance)} .ic.cf{color:var(--chest)} .ic.ut{color:var(--utility)} .ic.tx{color:var(--muted)}
.own{position:absolute;left:0;right:0;bottom:0;height:8%;background:var(--oc,transparent);transition:background .3s}
.mtag{display:none}
.tile.mort{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(201,60,60,.10) 6px 8px)}
.tile.mort .in>:not(.own):not(.mtag){opacity:.35}
.tile.mort .mtag{display:block;position:absolute;left:6%;right:6%;top:44%;transform:rotate(-24deg);font-weight:700;font-size:max(6px,calc(var(--c)*.1));text-transform:uppercase;letter-spacing:.04em;color:var(--neg);border:1.5px solid var(--neg);border-radius:4px;background:var(--tile);padding:1px 0}
.cn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%;text-align:center;font-weight:700;font-size:max(7px,calc(var(--k)*.085));line-height:1.1;padding:6%}
.cn .ico{width:42%;height:auto}
.cn b{font-family:var(--display);font-weight:800}
.cn.start{color:var(--g-rood)}
.cn.start b{font-size:calc(var(--k)*.24);letter-spacing:-.02em}
.cn.start .cs{color:var(--fg)}
.cn.start .ico{width:60%;stroke-width:2.6}
.cn.park .ico{color:var(--g-rood)}
.cn.gojail .ico{color:var(--chest)}
.cn .pot{font-family:var(--mono);color:var(--pos);font-size:calc(var(--k)*.1)}
.cn.jail{padding:0;justify-content:flex-end}
.cell{position:absolute;right:0;top:0;width:72%;height:72%;background:var(--jail);border-bottom-left-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;color:var(--fg)}
.cell .ico{width:48%;color:var(--g-oranje)}
.visit{position:absolute;left:0;right:0;bottom:6%;font-size:max(6px,calc(var(--k)*.08));color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.board.compact .nm,.board.compact .city{display:none}
.board.compact .ic{margin-top:20%;width:calc(var(--c)*.6);height:calc(var(--c)*.6)}
.board.compact .ic.big{margin-top:auto}
.board.compact .pr{font-size:max(7px,calc(var(--c)*.24));letter-spacing:-.04em}
.board.compact .cn .cs,.board.compact .visit,.board.compact .cell span{display:none}
.board.compact .cn{font-size:max(7px,calc(var(--k)*.12))}
.tile.glow{animation:glow 1s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--glow)}35%{box-shadow:0 0 0 3px var(--glow),0 0 22px 6px var(--glow)}100%{box-shadow:0 0 0 0 transparent}}
.board.managing .tile:not(.lit){opacity:.38}
.tile.lit{box-shadow:0 0 0 3px var(--accent);z-index:3}

.center{grid-area:2/2/11/11;position:relative;background:var(--tile2);border-radius:12px;overflow:hidden;display:grid;place-items:center}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.wm span{transform:rotate(-45deg);font-family:var(--display);font-weight:800;font-size:calc(var(--c)*1.45);letter-spacing:-.03em;color:var(--fg);opacity:.06;white-space:nowrap}
.deck{position:absolute;width:calc(var(--c)*2.3);height:calc(var(--c)*1.45);transform:rotate(-45deg)}
.d-ch{left:6%;top:12%}
.d-cf{right:6%;bottom:12%}
.dk{position:absolute;inset:0;border-radius:10px;background:var(--chance);opacity:.35;transform:translate(4px,4px)}
.dk.b2{opacity:.6;transform:translate(2px,2px)}
.dk.top{opacity:1;transform:none;display:flex;align-items:center;justify-content:center;gap:6%;color:#fff;font-family:var(--display);font-weight:700;font-size:max(9px,calc(var(--c)*.22));box-shadow:var(--shadow-s)}
.dk.top .ico{width:30%;height:auto}
.d-cf .dk{background:var(--chest)}
.board.compact .dk.top b{display:none}
.cmid{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--c)*.16);width:72%}
.turnlbl{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:99px;padding:4px 14px 4px 4px;box-shadow:var(--shadow-s);font-weight:700;font-size:max(11px,calc(var(--c)*.2));max-width:100%}
.turnlbl .pawn{width:max(22px,calc(var(--c)*.42));height:max(22px,calc(var(--c)*.42))}
.turnlbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dice{display:flex;gap:calc(var(--c)*.22)}
.die{width:max(30px,calc(var(--c)*.92));aspect-ratio:1;max-width:100%;background:#FFFFFF;border-radius:22%;box-shadow:0 6px 14px rgba(0,0,0,.2),inset 0 -3px 0 rgba(0,0,0,.08);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16%;gap:6%}
.die i{border-radius:50%}
.die i.on{background:#1B2422}
.die.roll{animation:shake .16s infinite}
.die.land{animation:bounce .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes shake{0%{transform:rotate(-14deg) translateY(-3px)}50%{transform:rotate(12deg) translateY(2px)}100%{transform:rotate(-14deg) translateY(-3px)}}
@keyframes bounce{0%{transform:scale(1.25)}60%{transform:scale(.92)}100%{transform:scale(1)}}
.feed{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:3px;font-size:max(10px,calc(var(--c)*.17))}
.feed li{display:flex;align-items:center;gap:6px;color:var(--muted);min-width:0}
.feed li:first-child{color:var(--fg);font-weight:600}
.feed li .pawn{width:1.35em;height:1.35em}
.feed li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board.compact .feed li:not(:first-child){display:none}

.tokens,.floats{position:absolute;left:var(--pad);top:var(--pad);right:var(--pad);bottom:var(--pad);pointer-events:none}
.tok{position:absolute;left:0;top:0;width:var(--t);height:var(--t);transition:transform var(--hop,140ms) ease-out;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));z-index:5}
.tok .pawn{width:100%;height:100%}
.tok.hop .pawn{animation:hop var(--hop,140ms) ease-out}
@keyframes hop{50%{transform:translateY(-38%) scale(1.08)}}
.tok.cur::before{content:"";position:absolute;inset:-22%;border-radius:50%;border:2.5px solid var(--pc);animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.35);opacity:0}}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-weight:600;font-size:14px;color:var(--pos);background:var(--surface);padding:3px 10px;border-radius:99px;box-shadow:var(--shadow-s);animation:rise 1.3s ease-out forwards;white-space:nowrap;z-index:6}

/* Spelers */
.plist2{display:grid;gap:8px}
.pc{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;transition:box-shadow .2s,opacity .3s}

.chip b{font-weight:700}
.chip .money{font-size:13px}
.chip.on{border-color:var(--pc);box-shadow:0 0 0 1.5px var(--pc)}
.chip.bk{opacity:.45;filter:grayscale(1)}

/* Acties */
.actions{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.act-head{display:flex;align-items:center;gap:10px}
.act-head .pawn{width:30px;height:30px}
.act-head div{display:flex;flex-direction:column;line-height:1.2}
.act-head span{font-family:var(--mono);font-size:13px;color:var(--muted)}

.act-row{display:flex;flex-wrap:wrap;gap:8px}

.act-row .sec{flex:1 1 auto}

.waiting{display:flex;align-items:center;gap:10px;color:var(--muted);min-height:52px}

@keyframes breathe{50%{transform:scale(.88)}}
.logbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0}

.loghead .inp{width:auto;min-height:36px;font-size:13px}
.log{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;display:grid;gap:2px;font-size:13px}

/* Vensters */
.ovl{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .18s}

.mdl{background:var(--surface);color:var(--fg);border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.32);width:min(440px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px;animation:pop .24s cubic-bezier(.2,.9,.3,1.15)}
.mdl h2{font-size:24px;font-weight:800;line-height:1.12;margin-bottom:6px;letter-spacing:-.01em}
.mdl h3{font-size:16px;font-weight:700}

.ovl.wide .mdl{width:min(720px,100%)}

.ovl.sheet .mdl{width:min(430px,100%);height:100%;max-height:none;border-radius:20px 0 0 20px;animation:slideL .26s ease-out}
.ovl.cardm .mdl,.ovl.handoff .mdl{background:transparent;box-shadow:none;width:min(360px,100%)}
.ovl.handoff{background:radial-gradient(circle at 50% 38%,var(--hc,#2E86AB),var(--felt) 75%);-webkit-backdrop-filter:none;backdrop-filter:none}
.ho{display:grid;justify-items:center;text-align:center;gap:10px;color:#fff}
.ho .pawn{width:120px;height:120px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.35));animation:floaty 4s ease-in-out infinite;--r:0deg}
.ho .eyebrow{color:rgba(255,255,255,.75);justify-content:center}
.ho h2{color:#fff;font-size:30px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0}}

@keyframes slideU{from{transform:translateY(60px);opacity:.4}}

.pcard{border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:0 30px 60px rgba(0,0,0,.35);animation:flip .6s cubic-bezier(.2,.8,.3,1.1);transform-origin:50% 50%}

.pc-h{display:flex;align-items:center;gap:10px;padding:16px 18px;background:var(--chance);color:#fff;font-family:var(--display);font-weight:800;font-size:22px}

.pc-h .ico{width:30px;height:30px}
.pc-b{padding:26px 22px 22px;text-align:center;min-height:150px;display:grid;align-content:center;gap:8px}
.pc-t{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2;margin:0!important}

.pcard .btns{padding:0 18px 18px;margin:0}

.bidder{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--tile2)}
.bidder .pawn{width:48px;height:48px}
.bidder b{font-family:var(--display);font-size:20px;display:block}
.high{font-size:15px;margin:14px 0 4px}
.high b{font-family:var(--mono);font-size:22px}
.bidgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.bidgrid .btn{padding:8px}
.mini{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.mini i{width:12px;height:36px;border-radius:4px;flex:none}
.mini div{display:grid;line-height:1.25}
.mini span{font-size:13px;color:var(--muted)}

.mgroup{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:12px}
.mgh{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.mgh i{width:14px;height:14px;border-radius:4px}
.mgh small{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}

.mname{display:grid;min-width:0;line-height:1.25}

.mbtns{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hcount{display:inline-flex;gap:1px;min-width:38px;justify-content:center}
.hcount svg{height:14px;width:auto}
.mfoot{position:sticky;bottom:-22px;background:var(--surface);margin:16px -22px -22px;padding:14px 22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mfoot .stock{font-size:13px;color:var(--muted);flex:1 1 100%}
.mfoot .btn{flex:1 1 auto}
.shortbox{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border-radius:14px;background:var(--tile2);font-size:14px;margin-top:8px}
.shortbox b{font-family:var(--mono);text-align:right}
.shortbox .big{font-size:20px}
.confirm{margin-top:14px;padding:14px;border:2px solid var(--neg);border-radius:14px}

.tcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.tside{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.tside h3{display:flex;align-items:center;gap:8px;font-size:15px}
.tside h3 .pawn{width:24px;height:24px}
.tlist{display:grid;gap:4px;max-height:220px;overflow:auto}
.tprop{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 4px;border-radius:8px;cursor:pointer;min-height:36px}
.tprop:hover{background:var(--tile2)}
.tprop input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.tprop em{color:var(--neg);font-style:normal;font-size:12px}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.tmoney{display:grid;gap:4px;font-size:13px;font-weight:600}
.tprob{min-height:20px;color:var(--neg);font-size:14px;margin:10px 0 0}
.offer{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:14px}

.order{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.order li{display:grid;grid-template-columns:30px 36px minmax(0,1fr) auto 30px;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--tile2);animation:pop .4s backwards;animation-delay:var(--d)}
.order li:first-child{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.order .pawn{width:34px;height:34px}
.order .rk{font-family:var(--mono);color:var(--muted)}
.order b{font-family:var(--mono);font-size:18px;text-align:right}
.mdice{display:inline-flex;gap:4px}
.mdie{width:22px;height:22px;background:#fff;border-radius:5px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:3px;gap:1px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mdie i{border-radius:50%}
.mdie i.on{background:#1B2422}

.rank{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.rank li{display:grid;grid-template-columns:28px 34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--tile2)}
.rank li:first-child{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.rank .pawn{width:32px;height:32px}
.rank b{font-family:var(--mono)}
.winner{display:grid;justify-items:center;text-align:center;gap:6px}
.winner .pawn{width:86px;height:86px;animation:floaty 4s ease-in-out infinite;--r:0deg}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.stat b{color:var(--fg);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat span.num{color:var(--fg)}

.rules details{border-bottom:1px solid var(--line);padding:4px 0}
.rules summary{cursor:pointer;font-weight:700;padding:10px 0;list-style-position:inside}
.rules details p,.rules details ul{margin:0 0 12px;color:var(--fg);font-size:14px}
.rules ul{padding-left:20px;display:grid;gap:4px}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--tile2)}
.dbg{display:grid;gap:10px;margin-top:12px}
.dbg .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dbg .inp{width:auto;flex:1 1 120px}
.dbg input.inp[type=number]{flex:0 0 74px}
.menu{display:grid;gap:8px;margin-top:10px}

#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(460px,calc(100% - 32px))}
.toast{background:var(--toast);color:var(--toast-fg);padding:8px 16px 8px 8px;border-radius:99px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:tin .28s cubic-bezier(.2,.9,.3,1.2);max-width:100%}
.toast.plain{padding-left:16px}
.toast .pawn{width:26px;height:26px}
.toast.hint{background:var(--accent);color:var(--accent-fg)}
.toast.out{transition:opacity .3s,transform .3s;opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.96)}}
#confetti{position:fixed;inset:0;z-index:95;pointer-events:none;width:100%;height:100%}

@media (max-width:1024px){
  #game{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "chips" "board" "side";padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
  #players{display:none}
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:18px 18px 0 0;border-width:1px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.12);gap:8px}
  .act-head{display:none}
  .act-row .main{flex:1 1 100%}

  .act-row .more{display:inline-flex}
  .act-row .sec{flex:1 1 0;min-width:0;padding-inline:10px}
  .act-row .sec span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .side{max-width:720px;width:100%;margin:0 auto}
}
@media (max-width:640px){
  .modes{grid-template-columns:1fr}
  .hero{padding:32px 22px 180px;min-height:0}

  .prow{grid-template-columns:48px minmax(0,1fr) 44px}
  .prow .seg{grid-column:1/3}
  .prow .lvl{grid-column:1/-1}
  .prow .rm{grid-row:1;grid-column:3}
  .ovl{place-items:end stretch;padding:0}

  .tbtns .lbl{display:none}

  .stats{grid-template-columns:1fr}
  .bidgrid{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:641px){ .tbtns .lbl{display:inline} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
(() => {
'use strict';
const SPELNAAM = "Stratenspel";
const SAVE_KEY = 'stratenspel-save-v1', PREF_KEY = 'stratenspel-prefs-v1';

/* ================= Hulpfuncties ================= */
const store = {
  get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const fmt = n => (n<0?'−':'')+'€'+Math.abs(Math.round(n)).toLocaleString('nl-NL');
const d6 = () => 1+Math.floor(Math.random()*6);
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SH = '­';

function animMs(ms,p){
  const a = S ? S.settings.anim : 'volledig';
  if(a==='uit') return 0;
  let f = a==='beperkt' ? .45 : 1;
  if(RM.matches) f = Math.min(f,.3);
  if(p && p.ai && UI.fast) f *= .12;
  return Math.round(ms*f);
}

/* ================= Regels ================= */
function rentFor(i,dice,opts={}){
  const sp=SPACES[i], pr=S.props[i];
  if(pr.mort||pr.owner==null) return 0;
  if(sp.type==='street'){
    if(pr.houses>0) return sp.rent[pr.houses];
    return sp.rent[0]*(hasMonopoly(pr.owner,sp.group)?2:1);
  }
  if(sp.type==='station'){
    const n=STATIONS.filter(s=>S.props[s].owner===pr.owner).length;
    return 25*Math.pow(2,n-1)*(opts.double?2:1);
  }
  const n=UTILS.filter(s=>S.props[s].owner===pr.owner).length;
  return (opts.utilTen?10:(n===2?10:4))*dice;
}
function whyNoBuild(p,i){
  const sp=SPACES[i], pr=S.props[i];
  if(sp.type!=='street') return 'Op stations en nutsbedrijven kun je niet bouwen';
  if(pr.owner!==p.id) return 'Dit is niet jouw straat';
  const g=GROUPS[sp.group];
  if(!hasMonopoly(p.id,sp.group)) return `Je hebt nog niet de hele ${g.adj} groep`;
  if(g.leden.some(m=>S.props[m].mort)) return 'Er rust een hypotheek op een straat in deze groep';
  if(pr.houses>=5) return 'Er staat al een hotel';
  const min=Math.min(...g.leden.map(m=>S.props[m].houses));
  if(pr.houses>min) return 'Bouw gelijkmatig: bouw eerst op de andere straten van deze groep';
  if(pr.houses===4 && S.hotels<1) return 'De bank heeft geen hotels meer';
  if(pr.houses<4 && S.houses<1) return 'De bank heeft geen huizen meer';
  if(p.money<g.huis) return 'Je hebt niet genoeg geld';
  return '';
}
function build(p,i){
  const pr=S.props[i], c=houseCost(i);
  if(pr.houses===4){ pr.houses=5; S.hotels--; S.houses+=4; } else { pr.houses++; S.houses--; }
  p.money-=c; sfx('build');
  log(`${p.name} bouwt ${pr.houses===5?'een hotel':'een huis'} op ${SPACES[i].name}`,p.id);
  return c;
}
function whyNoSell(p,i){
  const pr=S.props[i];
  if(SPACES[i].type!=='street'||!pr.houses) return 'Hier staan geen gebouwen';
  const g=GROUPS[SPACES[i].group];
  const max=Math.max(...g.leden.map(m=>S.props[m].houses));
  if(pr.houses<max) return 'Verkoop gelijkmatig: verkoop eerst op de andere straten';
  if(pr.houses===5 && S.houses<4) return 'De bank heeft te weinig huizen om het hotel te vervangen. Verkoop alle gebouwen in deze groep.';
  return '';
}
function sellHouse(p,i){
  const pr=S.props[i], c=houseCost(i), wasHotel=pr.houses===5;
  if(wasHotel){ pr.houses=4; S.hotels++; S.houses-=4; } else { pr.houses--; S.houses++; }
  p.money+=c/2;
  log(`${p.name} verkoopt ${wasHotel?'een hotel':'een huis'} op ${SPACES[i].name} voor ${fmt(c/2)}`,p.id);
  return {amt:c/2,hotel:wasHotel};
}
function sellGroup(p,g){
  let amt=0; const before={};
  GROUPS[g].leden.forEach(m=>{
    const pr=S.props[m]; before[m]=pr.houses;
    if(pr.houses===5){ S.hotels++; amt+=5*GROUPS[g].huis/2; } else { S.houses+=pr.houses; amt+=pr.houses*GROUPS[g].huis/2; }
    pr.houses=0;
  });
  p.money+=amt;
  log(`${p.name} verkoopt alle gebouwen in de ${GROUPS[g].adj} groep voor ${fmt(amt)}`,p.id);
  return {amt,before};
}
function whyNoMortgage(p,i){
  const pr=S.props[i];
  if(pr.owner!==p.id) return 'Dit is niet jouw eigendom';
  if(pr.mort) return 'Er rust al een hypotheek op';
  if(SPACES[i].type==='street' && groupBuilt(SPACES[i].group)) return 'Verkoop eerst alle gebouwen in deze groep';
  return '';
}
function mortgage(p,i){ const pr=S.props[i], amt=SPACES[i].price/2; pr.mort=true; p.money+=amt; log(`${p.name} neemt een hypotheek op ${SPACES[i].name} (+${fmt(amt)})`,p.id); return amt; }
function whyNoUnmort(p,i){ return p.money<unmortCost(i) ? `Aflossen kost ${fmt(unmortCost(i))}; je hebt niet genoeg geld` : ''; }
function unmortgage(p,i){ const c=unmortCost(i); S.props[i].mort=false; p.money-=c; log(`${p.name} lost de hypotheek op ${SPACES[i].name} af (${fmt(c)})`,p.id); return c; }
function maxRaise(p){
  let v=0;
  ownedBy(p.id).forEach(i=>{ const pr=S.props[i]; if(SPACES[i].type==='street') v+=pr.houses*houseCost(i)/2; if(!pr.mort) v+=SPACES[i].price/2; });
  return v;
}
function netWorth(p){
  let v=p.money;
  ownedBy(p.id).forEach(i=>{ const sp=SPACES[i], pr=S.props[i]; v+= pr.mort ? sp.price/2 : sp.price; if(sp.type==='street') v+=pr.houses*houseCost(i); });
  return v;
}
const jailCardCount = p => (S.jailCards.chance===p.id?1:0)+(S.jailCards.chest===p.id?1:0);
const hasJailCard = p => jailCardCount(p)>0;
const toPot = amt => { if(S.settings.pot) S.pot+=amt; };
function completesGroup(pid,i){ const sp=SPACES[i]; return sp.type==='street' && GROUPS[sp.group].leden.every(m=>m===i||S.props[m].owner===pid); }

/* ================= Geld ================= */
function addMoney(p,amt){ p.money+=amt; }
async function pay(p,amount,to,reason){
  if(amount<=0) return true;
  if(p.money<amount){
    const ok = p.ai ? (autoLiquidate(p,amount), p.money>=amount) : await debtScreen(p,amount,to,reason);
    if(!ok || p.money<amount){ await bankrupt(p, to && typeof to==='object' ? to : null); return false; }
  }
  p.money-=amount;
  if(to && typeof to==='object') to.money+=amount;
  else if(to==='pot') toPot(amount);
  sfx('pay'); render();
  return true;
}
function autoLiquidate(p,target){
  let guard=0;
  while(p.money<target && guard++<200){
    const own=ownedBy(p.id);
    let c=own.filter(i=>!whyNoMortgage(p,i) && !(SPACES[i].type==='street'&&hasMonopoly(p.id,SPACES[i].group))).sort((a,b)=>SPACES[a].price-SPACES[b].price)[0];
    if(c!=null){ mortgage(p,c); continue; }
    c=own.filter(i=>SPACES[i].type==='street'&&!whyNoSell(p,i)).sort((a,b)=>S.props[b].houses-S.props[a].houses)[0];
    if(c!=null){ sellHouse(p,c); continue; }
    c=own.find(i=>S.props[i].houses>0);
    if(c!=null){ sellGroup(p,SPACES[c].group); continue; }
    c=own.filter(i=>!whyNoMortgage(p,i))[0];
    if(c!=null){ mortgage(p,c); continue; }
    break;
  }
}
async function bankrupt(p,cred){
  if(p.bankrupt) return;
  log(`${p.name} is failliet${cred?` en draagt alles over aan ${cred.name}`:''}`,p.id);
  toast(`${p.name} is failliet`,p); sfx('bk');
  Object.keys(GROUPS).forEach(g=>{ if(GROUPS[g].leden.some(i=>S.props[i].owner===p.id&&S.props[i].houses>0)) sellGroup(p,g); });
  const props=ownedBy(p.id);
  p.bankrupt=true; p.bankruptAt=S.turn; p.inJail=false;
  if(cred){
    if(p.money>0) cred.money+=p.money;
    p.money=0;
    props.forEach(i=>{ S.props[i].owner=cred.id; if(S.props[i].mort){ const f=interestOf(i); if(cred.money>=f){ cred.money-=f; log(`${cred.name} betaalt ${fmt(f)} rente op ${SPACES[i].name}`,cred.id); } } });
    ['chance','chest'].forEach(d=>{ if(S.jailCards[d]===p.id) S.jailCards[d]=cred.id; });
  } else {
    p.money=0;
    props.forEach(i=>{ S.props[i]={owner:null,houses:0,mort:false}; });
    ['chance','chest'].forEach(d=>{ if(S.jailCards[d]===p.id){ S.jailCards[d]=null; S.decks[d].push(JAILCARD_ID[d]); } });
  }
  render();
  if(active().length<=1){ await endGame('failliet'); return; }
  if(!cred && S.settings.auctions){ for(const i of props){ if(S.over) break; await auction(i); } }
}

/* ================= Spelverloop ================= */
async function gameLoop(){
  const g=UI.gen;
  while(S && !S.over && g===UI.gen){
    await turn();
    if(!S || S.over || g!==UI.gen) break;
    nextPlayer();
  }
}
function nextPlayer(){
  const n=S.players.length; let i=S.cur, guard=0;
  do{ i=(i+1)%n; }while(S.players[i].bankrupt && guard++<10);
  S.cur=i; S.turn++; S.phase='preroll'; S.doubles=0;
  save();
}
function timeUp(){ return S.settings.timeLimit>0 && S.elapsedMs>=S.settings.timeLimit*60000; }

async function turn(){
  const p=curP();
  if(p.bankrupt) return;
  if(timeUp()){ await endGame('tijd'); return; }
  UI.undo=[];
  render();
  if(!p.ai && ((S.phase==='preroll'&&S.doubles===0) || UI.holder==null)) await ensureHolder(p,'Volgende beurt','Ik ben '+p.name+', start mijn beurt');
  if(S.phase==='preroll'){
    for(;;){
      save(); render();
      if(p.ai){ await aiWait(); await aiJail(p); await aiBuild(p); await aiWait(); }
      else await waitHuman('roll');
      if(S.over||p.bankrupt) return;
      const [a,b]=await rollDice(p); const sum=a+b, dbl=a===b;
      log(`${p.name} gooit ${a} + ${b} = ${sum}${dbl?' (dubbel)':''}`,p.id);
      if(p.inJail){
        if(dbl){
          p.inJail=false; p.jailTurns=0;
          log(`${p.name} gooit dubbel en komt vrij`,p.id); toast(`${p.name} gooit dubbel en komt vrij`,p);
          await moveBy(p,sum); await land(p,sum);
        } else {
          p.jailTurns++; p.stats.jail++;
          if(p.jailTurns>=3){
            log(`${p.name} zat 3 beurten vast en moet ${fmt(50)} betalen`,p.id); toast(`${p.name} betaalt ${fmt(50)} en verlaat de gevangenis`,p);
            const ok=await pay(p,50,'pot','de boete om uit de gevangenis te komen'); if(!ok) return;
            p.inJail=false; p.jailTurns=0;
            await moveBy(p,sum); await land(p,sum);
          } else { log(`${p.name} blijft in de gevangenis (poging ${p.jailTurns} van 3)`,p.id); toast(`Geen dubbel: ${p.name} blijft in de gevangenis`,p); }
        }
        break;
      }
      if(dbl){
        S.doubles++;
        if(S.doubles>=3){ log(`${p.name} gooit 3× dubbel en moet naar de gevangenis`,p.id); toast(`3× dubbel! ${p.name} gaat naar de gevangenis`,p); await goToJail(p); break; }
      }
      await moveBy(p,sum); await land(p,sum);
      if(S.over||p.bankrupt) return;
      if(dbl && !p.inJail){ S.phase='preroll'; toast(`Dubbel! ${p.name} gooit nog een keer`,p); continue; }
      break;
    }
    if(S.over||p.bankrupt) return;
    S.phase='postroll';
  }
  save(); render();
  if(p.ai){ await aiWait(); await aiBuild(p); await aiTrades(p); await aiWait(); }
  else await waitHuman('end');
}
function waitHuman(kind){ return new Promise(r=>{ UI.wait={kind,resolve:r}; render(); }); }
function mainAction(){ const w=UI.wait; if(!w) return; UI.wait=null; render(); w.resolve(); }

async function ensureHolder(p,msg,btn){
  if(p.ai) return;
  if(humans().length>1 && UI.holder!==p.id) await handoff(p,msg,btn);
  UI.holder=p.id;
}
async function handoff(p,msg,btn){
  const html=`<div class="ho">${pawnSVG(p.token,p.color)}<p class="eyebrow">${esc(msg||'')}</p><h2>Geef het apparaat aan ${esc(p.name)}</h2><div class="btns" style="width:100%"><button class="btn big light" data-v="ok">${esc(btn||('Ik ben '+p.name+', ga verder'))}</button></div></div>`;
  await openModal(1,{html,cls:'handoff',style:`--hc:${p.color}`});
  UI.holder=p.id;
}

async function rollDice(p){
  let a=d6(), b=d6();
  if(UI.fixedDice){ [a,b]=UI.fixedDice; UI.fixedDice=null; }
  sfx('dice');
  const dur=animMs(700,p), d1=$('#d1'), d2=$('#d2');
  if(dur>0){
    d1.classList.add('roll'); d2.classList.add('roll');
    const end=performance.now()+dur;
    while(performance.now()<end){ d1.innerHTML=dieHTML(d6()); d2.innerHTML=dieHTML(d6()); await gsleep(80); }
    d1.classList.remove('roll'); d2.classList.remove('roll');
  }
  S.dice=[a,b]; renderDice(true);
  if(dur>0) await gsleep(animMs(250,p));
  return [a,b];
}
async function moveBy(p,n){
  const step=animMs(150,p);
  $('#tokens').style.setProperty('--hop',(step||1)+'ms');
  for(let k=1;k<=n;k++){
    p.pos=(p.pos+1)%40;
    if(p.pos===0){
      const amt=(k===n&&S.settings.doubleGo)?400:200;
      p.money+=amt;
      log(`${p.name} ${k===n?'landt op':'passeert'} Start en ontvangt ${fmt(amt)}`,p.id);
      floatAt(0,'+'+fmt(amt)); sfx('coin'); updatePlayers();
    }
    if(step){ positionTokens(p.id); sfx('step'); await gsleep(step); }
  }
  positionTokens(); render();
}
async function moveBack(p,n){
  const step=animMs(150,p);
  for(let k=0;k<n;k++){ p.pos=(p.pos+39)%40; if(step){ positionTokens(p.id); sfx('step'); await gsleep(step); } }
  positionTokens(); render();
}
async function moveTo(p,target){ await moveBy(p,(target-p.pos+40)%40); }
async function goToJail(p){
  p.pos=10; p.inJail=true; p.jailTurns=0; S.doubles=0;
  sfx('jail'); positionTokens(); render();
  log(`${p.name} gaat naar de gevangenis`,p.id);
  await gsleep(animMs(400,p));
}

async function land(p,dice,opts={}){
  const i=p.pos, sp=SPACES[i];
  render();
  if(isOwnable(i)){
    const pr=S.props[i];
    if(pr.owner==null){ await offerBuy(p,i); return; }
    if(pr.owner===p.id) return;
    const o=S.players[pr.owner];
    if(pr.mort){ log(`Op ${sp.name} rust een hypotheek: geen huur`,p.id); toast(`${sp.name} heeft een hypotheek: geen huur`,p); return; }
    let ds=dice;
    if(sp.type==='utility' && opts.utilTen){ toast(`${p.name} gooit opnieuw voor het nutsbedrijf`,p); const [a,b]=await rollDice(p); ds=a+b; }
    const rent=rentFor(i,ds,opts);
    log(`${p.name} betaalt ${fmt(rent)} huur aan ${o.name} voor ${sp.name}`,p.id);
    toast(`${p.name} betaalt ${fmt(rent)} huur aan ${o.name}`,p);
    floatAt(i,'−'+fmt(rent),'neg');
    const ok=await pay(p,rent,o,`huur voor ${sp.name}`);
    if(ok) o.stats.rent+=rent;
    return;
  }
  switch(sp.type){
    case 'tax':
      log(`${p.name} betaalt ${fmt(sp.amount)} ${sp.name.toLowerCase()}`,p.id); toast(`${p.name} betaalt ${fmt(sp.amount)} ${sp.name.toLowerCase()}`,p);
      floatAt(i,'−'+fmt(sp.amount),'neg');
      await pay(p,sp.amount,'pot',sp.name.toLowerCase()); break;
    case 'chance': case 'chest': await drawCard(p,sp.type); break;
    case 'gotojail': toast(`${p.name} moet naar de gevangenis`,p); await goToJail(p); break;
    case 'parking':
      if(S.settings.pot && S.pot>0){ const amt=S.pot; p.money+=amt; S.pot=0; log(`${p.name} krijgt de pot van Vrij Parkeren: ${fmt(amt)}`,p.id); toast(`${p.name} wint de pot: ${fmt(amt)}`,p); floatAt(20,'+'+fmt(amt)); sfx('coin'); render(); }
      break;
  }
}

async function offerBuy(p,i){
  const sp=SPACES[i];
  let buy=false;
  if(p.money>=sp.price){
    if(p.ai){ buy=aiWantsBuy(p,i); await aiWait(.5); }
    else buy = (await buyModal(p,i))==='buy';
  } else {
    toast(`${p.name} heeft te weinig geld voor ${sp.name}`,p);
    log(`${p.name} kan ${sp.name} niet betalen`,p.id);
    if(!p.ai) await gsleep(600);
  }
  if(buy){
    p.money-=sp.price; S.props[i].owner=p.id;
    log(`${p.name} koopt ${sp.name} voor ${fmt(sp.price)}`,p.id);
    toast(`${p.name} koopt ${sp.name} voor ${fmt(sp.price)}`,p);
    glowTile(i,p.color); sfx('buy'); hintGroup(p,i); render();
    return;
  }
  if(S.settings.auctions) await auction(i);
  else log(`${sp.name} blijft bij de bank`);
}
function groupHint(p,i){
  const sp=SPACES[i];
  if(sp.type==='street'){
    const g=GROUPS[sp.group], have=g.leden.filter(m=>m!==i&&S.props[m].owner===p.id).length+1;
    if(have===g.leden.length) return `Hiermee heb je de hele ${g.adj} groep. Daarna kun je huizen bouwen.`;
    const others=g.leden.filter(m=>m!==i&&S.props[m].owner!=null&&S.props[m].owner!==p.id).length;
    return `Hiermee heb je ${have} van de ${g.leden.length} ${g.adj} straten.${others?' Een andere speler heeft er al een.':''}`;
  }
  if(sp.type==='station'){ const n=STATIONS.filter(s=>S.props[s].owner===p.id).length+1; return `Hiermee heb je ${n} ${n===1?'station':'stations'}: huur ${fmt(25*Math.pow(2,n-1))}.`; }
  const n=UTILS.filter(s=>S.props[s].owner===p.id).length+1;
  return n===2 ? 'Hiermee heb je beide nutsbedrijven: huur 10× de ogen.' : 'Huur is 4× de ogen, of 10× met beide nutsbedrijven.';
}
async function buyModal(p,i){
  const sp=SPACES[i];
  const html=`${humans().length>1?`<p class="eyebrow">${pawn(p)}${esc(p.name)}</p>`:''}<h2>${esc(sp.name)} kopen?</h2>${deedHTML(i)}
    <div class="kv"><span>Saldo nu</span><b>${fmt(p.money)}</b><span>Na aankoop</span><b>${fmt(p.money-sp.price)}</b></div>
    <p class="hint">${icon('bulbhint')}<span>${groupHint(p,i)}</span></p>
    <div class="btns"><button class="btn primary big" data-v="buy">Koop voor ${fmt(sp.price)}</button><button class="btn big" data-v="no">${S.settings.auctions?'Niet kopen, veilen':'Niet kopen'}</button></div>`;
  return openModal(1,{html});
}
function hintGroup(p,i){
  const sp=SPACES[i];
  if(p.ai||!S.settings.hints||sp.type!=='street') return;
  if(hasMonopoly(p.id,sp.group)) toast(`${p.name}, je hebt nu de hele ${GROUPS[sp.group].adj} groep! Bouwen levert veel meer huur op.`,p,'hint',4500);
}

async function auction(i){
  const sp=SPACES[i]; const ids=active().map(p=>p.id);
  if(!ids.length||S.over) return;
  let high=0, by=null; const passed=new Set();
  log(`Veiling van ${sp.name} begint`);
  toast(`Veiling: ${sp.name}`);
  let k=Math.max(0,ids.indexOf(curP().id)), guard=0;
  while(guard++<600){
    const left=ids.filter(id=>!passed.has(id));
    if(!left.length) break;
    if(by!=null && left.length===1 && left[0]===by) break;
    const id=ids[k%ids.length]; k++;
    if(passed.has(id)||id===by) continue;
    const p=S.players[id];
    if(p.money<=high){ passed.add(id); continue; }
    let bid;
    if(p.ai){ bid=aiBid(p,i,high); if(bid!=null){ toast(`${p.name} biedt ${fmt(bid)}`,p); await aiWait(.55); } }
    else { const v=await auctionModal(p,i,high,by); bid = (!v||v==='pass') ? null : high+parseInt(v,10); }
    if(bid==null || bid<=high || bid>p.money) passed.add(id);
    else { high=bid; by=id; log(`${p.name} biedt ${fmt(bid)} op ${sp.name}`,id); }
  }
  if(by!=null){
    const w=S.players[by]; w.money-=high; S.props[i].owner=by;
    log(`${w.name} wint de veiling van ${sp.name} voor ${fmt(high)}`,by);
    toast(`${w.name} koopt ${sp.name} op de veiling voor ${fmt(high)}`,w);
    glowTile(i,w.color); sfx('buy'); hintGroup(w,i);
  } else { log(`Niemand biedt op ${sp.name}; het blijft bij de bank`); toast(`Geen biedingen: ${sp.name} blijft bij de bank`); }
  render();
}
function auctionModal(p,i,high,by){
  const sp=SPACES[i];
  const incs=[1,10,50,100].map(n=>{ const why=high+n>p.money?'Zoveel geld heb je niet':''; return `<button class="btn${why?' is-disabled':''}" data-v="${n}" ${why?`data-why="${why}"`:''}>+${fmt(n)}</button>`; }).join('');
  const html=`<p class="eyebrow">Veiling</p><div class="bidder">${pawn(p)}<div><span class="muted small">Aan de beurt om te bieden</span><b>${esc(p.name)}</b><span class="muted small">Saldo ${fmt(p.money)}</span></div></div>
    <div class="mini" style="margin-top:12px"><i style="background:${swatch(i)}"></i><div><b>${esc(sp.name)}</b><span>Vraagprijs ${fmt(sp.price)}</span></div></div>
    <p class="high">${by!=null?`Hoogste bod: <b>${fmt(high)}</b> van ${esc(S.players[by].name)}`:'Nog geen bod. Begin bij €1.'}</p>
    <div class="bidgrid">${incs}</div>
    <div class="btns"><button class="btn big" data-v="pass">Passen</button></div>`;
  return openModal(1,{html,cls:'auction'});
}

/* ================= Kaarten ================= */
async function drawCard(p,deck,forcedId){
  const d=S.decks[deck]; let id;
  if(forcedId!=null){ const k=d.indexOf(forcedId); if(k<0){ toast('Deze kaart zit nu niet in de stapel'); return; } d.splice(k,1); id=forcedId; }
  else id=d.shift();
  const card=DECKS[deck][id];
  if(card.a.jailcard) S.jailCards[deck]=p.id; else d.push(id);
  log(`${p.name} trekt ${DECKNAME[deck]}: ${card.t} ${card.s}`.trim(),p.id);
  await showCard(p,deck,card);
  await applyCard(p,card);
}
async function showCard(p,deck,card){
  const html=`<div class="pcard ${deck}"><div class="pc-h">${icon(deck==='chance'?'question':'chest')}<span>${DECKNAME[deck]}</span></div><div class="pc-b">${humans().length>1||p.ai?`<p class="eyebrow" style="justify-content:center">${pawn(p)}${esc(p.name)}</p>`:''}<p class="pc-t">${esc(card.t)}</p>${card.s?`<p class="pc-s">${esc(card.s)}</p>`:''}</div><div class="btns"><button class="btn primary big" data-v="ok">OK</button></div></div>`;
  if(p.ai){
    const pr=openModal(1,{html,cls:'cardm'});
    await aiWait(1.9);
    if(LAYERS[1].res) closeModal(1,'ok');
    await pr;
  } else await openModal(1,{html,cls:'cardm'});
}
async function applyCard(p,c){
  const a=c.a;
  if(a.go!=null){ await moveTo(p,a.go); await land(p,0); return; }
  if(a.near){
    const list=a.near==='station'?STATIONS:UTILS;
    let t=list.find(x=>x>p.pos); if(t==null) t=list[0];
    await moveTo(p,t); await land(p,0,a.near==='station'?{double:true}:{utilTen:true}); return;
  }
  if(a.money>0){ p.money+=a.money; floatAt(p.pos,'+'+fmt(a.money)); sfx('coin'); render(); return; }
  if(a.money<0){ floatAt(p.pos,'−'+fmt(-a.money),'neg'); await pay(p,-a.money,'pot','een kaart'); return; }
  if(a.jailcard){ toast(`${p.name} bewaart de vrijkaart`,p); render(); return; }
  if(a.back){ await moveBack(p,a.back); await land(p,0); return; }
  if(a.jail){ await goToJail(p); return; }
  if(a.repairs){
    let h=0,ho=0; ownedBy(p.id).forEach(i=>{ const n=S.props[i].houses; if(n===5) ho++; else h+=n; });
    const amt=h*a.repairs[0]+ho*a.repairs[1];
    log(`${p.name} heeft ${h} huizen en ${ho} hotels: ${fmt(amt)} reparatiekosten`,p.id);
    if(amt>0){ floatAt(p.pos,'−'+fmt(amt),'neg'); await pay(p,amt,'pot','reparaties'); } else toast('Geen gebouwen, dus niets te betalen',p);
    return;
  }
  if(a.payEach){
    const others=active().filter(o=>o!==p), tot=a.payEach*others.length;
    const ok=await pay(p,tot,'bank','de andere spelers');
    if(ok) others.forEach(o=>{ o.money+=a.payEach; });
    render(); return;
  }
  if(a.collectEach){
    for(const o of active().filter(o=>o!==p)){ if(p.bankrupt||S.over) break; await pay(o,a.collectEach,p,`de verjaardag van ${p.name}`); }
    render(); return;
  }
}
function payJail(p){
  if(p.money<50||!p.inJail) return;
  p.money-=50; toPot(50); p.inJail=false; p.jailTurns=0;
  log(`${p.name} betaalt ${fmt(50)} en verlaat de gevangenis`,p.id); sfx('pay');
  positionTokens(); render(); save();
}
function useJailCard(p){
  const d=S.jailCards.chance===p.id?'chance':'chest';
  S.jailCards[d]=null; S.decks[d].push(JAILCARD_ID[d]); p.inJail=false; p.jailTurns=0;
  log(`${p.name} gebruikt een vrijkaart en verlaat de gevangenis`,p.id);
  positionTokens(); render(); save();
}

/* ================= Schulden ================= */
function debtHTML(p,amount,to,reason,confirm){
  const short=Math.max(0,amount-p.money), toName=to&&typeof to==='object'?to.name:'de bank', maxR=maxRaise(p);
  const rows=[];
  Object.keys(GROUPS).forEach(g=>{
    GROUPS[g].leden.filter(i=>S.props[i].owner===p.id).forEach(i=>{
      const pr=S.props[i], ws=whyNoSell(p,i), wm=whyNoMortgage(p,i);
      const btns=[];
      if(pr.houses>0){
        btns.push(`<button class="btn s${ws?' is-disabled':''}" data-act="sell" data-i="${i}" ${ws?`data-why="${esc(ws)}"`:''}>Verkoop ${pr.houses===5?'hotel':'huis'} +${fmt(houseCost(i)/2)}</button>`);

function undo(){
  const p=curP(), u=UI.undo[UI.undo.length-1]; if(!u) return;
  const pr=S.props[u.i];
  if(u.t==='build'){
    if(pr.houses===5){ if(S.houses<4) return toast('Kan niet ongedaan maken: de bank heeft te weinig huizen'); pr.houses=4; S.hotels++; S.houses-=4; }

    p.money+=u.amt;
  } else if(u.t==='sell'){
    if(p.money<u.amt) return toast('Je hebt niet genoeg geld om dit ongedaan te maken');

    else { if(S.houses<1) return toast('De bank heeft geen huizen meer'); pr.houses++; S.houses--; }

/* ================= Handelen ================= */
const tradableProps = P => ownedBy(P.id).filter(i=>!(SPACES[i].type==='street'&&groupBuilt(SPACES[i].group)));
function tradeProblem(o){
  const A=S.players[o.from], B=S.players[o.to];
  if(!B||A.bankrupt||B.bankrupt||A===B) return 'Kies een andere speler om mee te ruilen';
  if(!o.giveProps.length&&!o.getProps.length&&!o.giveMoney&&!o.getMoney&&!o.giveCards.length&&!o.getCards.length) return 'Kies eerst wat je wilt ruilen';
  if(o.giveProps.some(i=>S.props[i].owner!==A.id)||o.getProps.some(i=>S.props[i].owner!==B.id)) return 'Een van de eigendommen hoort niet (meer) bij deze speler';
  if([...o.giveProps,...o.getProps].some(i=>SPACES[i].type==='street'&&groupBuilt(SPACES[i].group))) return 'Straten uit een groep met gebouwen kun je niet ruilen';
  if(o.giveMoney>A.money) return `${A.name} heeft maar ${fmt(A.money)}`;
  if(o.getMoney>B.money) return `${B.name} heeft maar ${fmt(B.money)}`;
  if(o.giveCards.some(d=>S.jailCards[d]!==A.id)||o.getCards.some(d=>S.jailCards[d]!==B.id)) return 'Een vrijkaart hoort niet bij deze speler';
  const intA=o.getProps.filter(i=>S.props[i].mort).reduce((s,i)=>s+interestOf(i),0);
  const intB=o.giveProps.filter(i=>S.props[i].mort).reduce((s,i)=>s+interestOf(i),0);
  if(A.money-o.giveMoney+o.getMoney<intA) return `${A.name} kan de hypotheekrente van ${fmt(intA)} niet betalen`;
  if(B.money-o.getMoney+o.giveMoney<intB) return `${B.name} kan de hypotheekrente van ${fmt(intB)} niet betalen`;
  return '';
}
function offerList(props,money,cards){
  const li=[...props.map(i=>`<li><span class="sw" style="background:${swatch(i)}"></span>${esc(SPACES[i].name)}${S.props[i].mort?' <em class="neg small">(hypotheek, 10% rente)</em>':''}</li>`)];
  if(money) li.push(`<li>${icon('coin')}<b class="num">${fmt(money)}</b></li>`);
  cards.forEach(()=>li.push(`<li>${icon('key')}Verlaat de gevangenis-kaart</li>`));
  return li.length?`<ul class="offer">${li.join('')}</ul>`:'<p class="muted small">Niets</p>';
}
function describeTrade(o){
  const A=S.players[o.from], B=S.players[o.to];
  const part=(props,money,cards)=>[...props.map(i=>SPACES[i].name),money?fmt(money):null,cards.length?cards.length+' vrijkaart':null].filter(Boolean).join(', ')||'niets';
  return `${A.name} geeft ${part(o.giveProps,o.giveMoney,o.giveCards)}; ${B.name} geeft ${part(o.getProps,o.getMoney,o.getCards)}`;
}
function executeTrade(o){
  const A=S.players[o.from], B=S.players[o.to];
  o.giveProps.forEach(i=>S.props[i].owner=B.id); o.getProps.forEach(i=>S.props[i].owner=A.id);
  A.money+=o.getMoney-o.giveMoney; B.money+=o.giveMoney-o.getMoney;
  o.giveCards.forEach(d=>S.jailCards[d]=B.id); o.getCards.forEach(d=>S.jailCards[d]=A.id);
  const interest=(P,list)=>list.forEach(i=>{ if(S.props[i].mort){ const f=interestOf(i); P.money-=f; log(`${P.name} betaalt ${fmt(f)} rente op ${SPACES[i].name}`,P.id); } });
  interest(B,o.giveProps); interest(A,o.getProps);
  log(`Ruil: ${describeTrade(o)}`,A.id);
  toast(`Ruil gelukt tussen ${A.name} en ${B.name}`);
  sfx('buy');
  o.giveProps.forEach(i=>{ glowTile(i,B.color); hintGroup(B,i); }); o.getProps.forEach(i=>{ glowTile(i,A.color); hintGroup(A,i); });
  render(); save();
}

async function tradeEditor(fromId,toId,pre,canChange){
  const st=pre?JSON.parse(JSON.stringify(pre)):{giveProps:[],getProps:[],giveMoney:0,getMoney:0,giveCards:[],getCards:[]};
  st.from=fromId; st.to=toId;

    st.giveProps=$$('input[data-tp="give"]:checked',box).map(x=>+x.value);

    st.getCards=$$('input[data-tc="get"]:checked',box).map(x=>x.value);

    onInput:(t)=>{ const box=t.closest('.mdl'); read(box); upd(box); },
    onAct:(a,el)=>{ if(a!=='send') return; const box=el.closest('.mdl'); read(box); const pr=tradeProblem(st); if(pr){ upd(box); toast(pr); return; } closeModal(1,'send'); }

async function proposeTrade(o,depth=0){
  const prob=tradeProblem(o); if(prob){ toast(prob); return false; }
  const A=S.players[o.from], B=S.players[o.to];
  let result=false;
  if(B.ai){
    await gsleep(UI.fast?80:600);
    result=aiAcceptTrade(B,o);
    log(`${B.name} ${result?'accepteert':'weigert'} een ruilvoorstel van ${A.name}`,B.id);
    if(result) executeTrade(o); else toast(`${B.name} weigert het voorstel`,B);
  } else {
    await ensureHolder(B,`${A.name} stelt een ruil voor`,`Ik ben ${B.name}, toon het voorstel`);
    const r=await tradeReviewModal(o);
    if(r==='accept'){ executeTrade(o); result=true; }
    else if(r==='counter' && depth<3){
      const c=await tradeEditor(B.id,A.id,{giveProps:o.getProps,getProps:o.giveProps,giveMoney:o.getMoney,getMoney:o.giveMoney,giveCards:o.getCards,getCards:o.giveCards},false);
      if(c) result=await proposeTrade(c,depth+1);
      else { toast(`${B.name} trekt het tegenbod in`,B); }
    } else { log(`${B.name} weigert een ruilvoorstel van ${A.name}`,B.id); toast(`${B.name} weigert het voorstel`,B); }
  }
  if(depth===0){ const c=curP(); if(!c.ai && !S.over) await ensureHolder(c,'Het ruilvoorstel is afgehandeld',`Ik ben ${c.name}, ga verder`); }
  render();
  return result;
}

/* ================= Computerspeler ================= */
const W = {bruin:.85,lichtblauw:1,roze:1.08,oranje:1.25,rood:1.18,geel:1.08,groen:1.02,donkerblauw:1};
function aiWait(f=1){
  return (async()=>{
    await gsleep(UI.fast?Math.round(60*f):Math.round(800*f));
    while(UI.paused || modalOpen(2)) await gsleep(200);
  })();
}
async function aiSay(p,text){ toast(text,p); await aiWait(); }
function propValue(pid,i){
  const sp=SPACES[i]; let v=sp.price;
  if(sp.type==='street'){
    v*=W[sp.group];
    const others=GROUPS[sp.group].leden.filter(m=>m!==i);
    const mine=others.filter(m=>S.props[m].owner===pid).length;
    if(mine===others.length) v*=1.7; else if(mine>0) v*=1.15;
    const opp=others.map(m=>S.props[m].owner);
    if(opp.every(o=>o!=null&&o!==pid) && new Set(opp).size===1) v*=1.3;
  } else if(sp.type==='station'){ v*=1+.2*STATIONS.filter(s=>s!==i&&S.props[s].owner===pid).length; }
  else { v*=UTILS.some(s=>s!==i&&S.props[s].owner===pid)?1.1:.8; }
  return v;
}
function aiWantsBuy(p,i){
  const pr=SPACES[i].price;
  if(p.level==='makkelijk') return Math.random()<.5;
  if(p.level==='normaal') return p.money-pr>=150 || completesGroup(p.id,i);
  return p.money-pr >= (propValue(p.id,i)>pr*1.3?0:100);
}
function aiBid(p,i,high){
  const pr=SPACES[i].price;
  let max = p.level==='makkelijk' ? pr*.7 : p.level==='normaal' ? pr*(completesGroup(p.id,i)?1.3:1) : propValue(p.id,i)*1.05;
  max=Math.floor(Math.min(max, p.money-(p.level==='moeilijk'?50:100)));
  let next = high<max*.5 ? Math.max(10,Math.round(max*.5/10)*10) : high+10;
  if(next<=high) next=high+10;
  return next<=max ? next : null;
}
function earlyGame(){ return OWNABLE.filter(i=>S.props[i].owner!=null).length < OWNABLE.length*.6; }
async function aiJail(p){
  if(!p.inJail) return;
  const out = p.level==='makkelijk' ? Math.random()<.5 : earlyGame();
  if(!out) return;
  if(hasJailCard(p)){ useJailCard(p); await aiSay(p,`${p.name} gebruikt een vrijkaart`); }
  else if(p.money>=(p.level==='makkelijk'?50:200)){ payJail(p); await aiSay(p,`${p.name} betaalt ${fmt(50)} en verlaat de gevangenis`); }
}
async function aiBuild(p){
  const reserve={makkelijk:500,normaal:200,moeilijk:150}[p.level];
  for(const i of ownedBy(p.id)){
    if(S.props[i].mort && p.money-unmortCost(i)>=reserve*1.5){ unmortgage(p,i); render(); await aiSay(p,`${p.name} lost de hypotheek op ${SPACES[i].name} af`); }
  }
  let count=0; const max=p.level==='makkelijk'?1:15;
  while(count<max){
    const c=ownedBy(p.id).filter(i=>SPACES[i].type==='street'&&!whyNoBuild(p,i)&&p.money-houseCost(i)>=reserve);
    if(!c.length) break;
    c.sort((a,b)=>S.props[a].houses-S.props[b].houses||W[SPACES[b].group]-W[SPACES[a].group]);
    build(p,c[0]); count++;
  }
  if(count){ render(); await aiSay(p,`${p.name} bouwt ${count===1?'een gebouw':count+' gebouwen'}`); }
}
function missingOne(pid,g){
  const mem=GROUPS[g].leden;
  if(groupBuilt(g)||mem.filter(m=>S.props[m].owner===pid).length!==mem.length-1) return null;
  const m=mem.find(x=>S.props[x].owner!==pid);
  return S.props[m].owner!=null ? m : null;
}
async function aiTrades(p){
  if(p.level==='makkelijk') return;
  for(const g of Object.keys(GROUPS)){
    const m=missingOne(p.id,g); if(m==null) continue;
    const other=S.players[S.props[m].owner]; if(other.bankrupt) continue;
    if((p.tradeCd[other.id]||-99)>S.turn-8) continue;
    p.tradeCd[other.id]=S.turn;
    // Eerst een ruil zoeken waarbij beide spelers een groep compleet maken
    let swap=null;
    for(const h of Object.keys(GROUPS)){ if(h===g) continue; const n=missingOne(other.id,h); if(n!=null&&S.props[n].owner===p.id){ swap=n; break; } }
    let offer;
    if(swap!=null){
      const diff=Math.round((SPACES[m].price-SPACES[swap].price)/10)*10;
      offer={from:p.id,to:other.id,giveProps:[swap],getProps:[m],giveMoney:Math.max(0,Math.min(diff,p.money-100)),getMoney:Math.max(0,-diff),giveCards:[],getCards:[]};
      if(offer.getMoney>other.money) offer.getMoney=0;
    } else {
      const money=Math.min(p.money-150,Math.round(SPACES[m].price*(p.level==='moeilijk'?2:1.6)/10)*10);
      if(money<SPACES[m].price) continue;
      offer={from:p.id,to:other.id,giveProps:[],getProps:[m],giveMoney:money,getMoney:0,giveCards:[],getCards:[]};
    }
    await aiSay(p,`${p.name} doet ${other.name} een ruilvoorstel`);
    await proposeTrade(offer,0);
    return;
  }
}
function aiAcceptTrade(ai,o){
  if(ai.level==='makkelijk') return false;
  const isFrom=o.from===ai.id;
  const recv=isFrom?o.getProps:o.giveProps, give=isFrom?o.giveProps:o.getProps;
  const recvM=isFrom?o.getMoney:o.giveMoney, giveM=isFrom?o.giveMoney:o.getMoney;
  const recvC=isFrom?o.getCards:o.giveCards, giveC=isFrom?o.giveCards:o.getCards;
  const other=isFrom?o.to:o.from;
  let gain=recvM-giveM+40*(recvC.length-giveC.length);
  recv.forEach(i=>gain+=propValue(ai.id,i)*(S.props[i].mort?.55:1));
  give.forEach(i=>gain-=propValue(ai.id,i)*(S.props[i].mort?.55:1));
  const otherCompletes=give.some(i=>SPACES[i].type==='street'&&GROUPS[SPACES[i].group].leden.every(m=>give.includes(m)||S.props[m].owner===other));
  const meCompletes=recv.some(i=>SPACES[i].type==='street'&&GROUPS[SPACES[i].group].leden.every(m=>recv.includes(m)||(S.props[m].owner===ai.id&&!give.includes(m))));
  if(otherCompletes&&!meCompletes) return ai.level==='moeilijk' ? false : gain>250;
  if(otherCompletes&&meCompletes) return gain>-60;
  return gain>(ai.level==='moeilijk'?40:15);
}

function confetti(){
  if(animMs(1000)===0) return;
  const cv=$('#confetti'), ctx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight; cv.hidden=false;
  const cols=PCOLORS.concat(['#F2C531','#7CC6E8']);
  const ps=Array.from({length:170},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  const f=t=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.03; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(t-t0<5000) requestAnimationFrame(f); else { ctx.clearRect(0,0,cv.width,cv.height); cv.hidden=true; }
  };

}

function openModal(n,o){

function initModals(){
  [1,2].forEach(n=>{

      if(b.hasAttribute('data-v')) closeModal(n,b.dataset.v);
      else if(L.opts&&L.opts.onAct) L.opts.onAct(b.dataset.act,b,e);
    });
    box.addEventListener('input',e=>{ const L=LAYERS[n]; if(L.opts&&L.opts.onInput) L.opts.onInput(e.target,e); });
    box.addEventListener('change',e=>{ const L=LAYERS[n]; if(L.opts&&L.opts.onChange) L.opts.onChange(e.target,e); });

function doAction(a){
  const p=S&&curP();
  switch(a){
    case 'main': mainAction(); break;
    case 'payjail': if(UI.wait&&p.inJail) payJail(p); break;
    case 'usecard': if(UI.wait&&p.inJail&&hasJailCard(p)) useJailCard(p); break;
    case 'manage': openManage(); break;
    case 'trade': openTrade(); break;
    case 'undo': undo(); break;
    case 'more': openMore(); break;
    case 'results': showResults(); break;
    case 'newgame': quitToSetup(); break;
  }
}
document.addEventListener('keydown',e=>{
  if(e.shiftKey&&(e.key==='D'||e.key==='d')&&S&&!$('#game').hidden){ const tag=(e.target.tagName||'').toLowerCase(); if(tag!=='input'&&tag!=='select'){ e.preventDefault(); openDebug(); return; } }
  if(e.key==='Escape'){
    if(modalOpen(2)&&LAYERS[2].opts&&LAYERS[2].opts.dismiss) closeModal(2,null);
    else if(modalOpen(1)&&LAYERS[1].opts&&LAYERS[1].opts.dismiss) closeModal(1,null);
    return;
  }
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea') return;
  if(e.key==='Enter'){
    if(document.activeElement&&document.activeElement.tagName==='BUTTON') return;
    const ov=modalOpen(2)?'#ovl2':modalOpen(1)?'#ovl':null;
    if(ov){ const b=$(ov+' .btn.primary:not(.is-disabled)'); if(b){ e.preventDefault(); b.click(); } }
    return;
  }
  if(!S||$('#game').hidden||modalOpen(1)||modalOpen(2)) return;
  if(e.key===' '&&UI.wait){ if(document.activeElement&&document.activeElement.tagName==='BUTTON') return; e.preventDefault(); mainAction(); }
  else if((e.key==='b'||e.key==='B')&&UI.wait) openManage();
  else if((e.key==='h'||e.key==='H')&&UI.wait) openTrade();
});

let AC=null;
function sfx(kind){
  if(!S||!S.settings.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const T=(f,d,type='sine',v=.05,dl=0)=>{ const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+dl; o.type=type; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.03); };
    switch(kind){
      case 'dice': for(let k=0;k<5;k++) T(300+Math.random()*400,.04,'square',.02,k*.07); break;
      case 'step': T(540,.035,'triangle',.025); break;
      case 'buy': T(880,.09,'sine',.06); T(1320,.16,'sine',.05,.08); break;
      case 'coin': T(1046,.08,'sine',.05); T(1568,.12,'sine',.04,.06); break;
      case 'pay': T(330,.12,'triangle',.04); break;
      case 'jail': T(220,.25,'sawtooth',.025); T(165,.3,'sawtooth',.025,.15); break;
      case 'build': T(660,.06,'square',.025); break;
      case 'win': [523,659,784,1046].forEach((f,k)=>T(f,.2,'sine',.05,k*.12)); break;
      case 'bk': T(196,.4,'sawtooth',.025); break;
    }
  }catch(e){}
}
