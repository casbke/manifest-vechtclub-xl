function toggleTheme(){
  const sysDark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  const cur=prefs.theme==='system'?(sysDark?'dark':'light'):prefs.theme;
  prefs.theme=cur==='dark'?'light':'dark';
  store.set(PREF_KEY,prefs); applyTheme();
  toast(prefs.theme==='dark'?'Donker thema':'Licht thema');
}

/* ================= Startscherm ================= */
const setup={mode:null,tab:'spelers',players:[],settings:{startMoney:1500,pot:false,doubleGo:false,auctions:true,timeLimit:0,anim:'volledig',sound:false,hints:true}};
if(prefs.settings) Object.assign(setup.settings,prefs.settings);
function defaultPlayers(mode){
  if(mode==='samen') return [{name:'Speler 1',token:'auto',ai:false,level:'normaal'},{name:'Speler 2',token:'hoed',ai:false,level:'normaal'},{name:'Speler 3',token:'hond',ai:false,level:'normaal'}];
  return [{name:'Jij',token:'auto',ai:false,level:'normaal'},{name:'Bram',token:'hoed',ai:true,level:'normaal'},{name:'Fleur',token:'hond',ai:true,level:'normaal'},{name:'Daan',token:'schip',ai:true,level:'normaal'}];
}
function fdeed(g,name,city,price,rent){
  return `<div class="fdeed"><div class="fd-h" style="background:${gcol(g)};color:${LIGHT_GROUPS.has(g)?'#1B2422':'#FFFFFF'}"><small>Eigendomsbewijs</small><b>${name}</b><span>${city}</span></div><div class="fd-b"><span>Huur</span><span>€${rent}</span><span>Met hotel</span><span>€${({Neude:950,Heerestraat:1100,Kalverstraat:2000})[name]}</span><span>Prijs</span><span>€${price}</span></div></div>`;
}
function renderSetup(){
  const saved=store.get(SAVE_KEY);
  const P=setup.players;
  const nH=P.filter(p=>!p.ai).length, nA=P.length-nH;
  const playersHTML=`<div class="plist">${P.map((p,i)=>`<div class="prow" data-i="${i}">
      <button class="pawnbtn" data-sact="token" aria-label="Pion: ${PAWNS[p.token].naam}. Klik voor een andere pion" title="Andere pion kiezen">${pawnSVG(p.token,PCOLORS[i])}</button>
      <input class="inp" id="pname${i}" data-sact="name" value="${esc(p.name)}" maxlength="14" aria-label="Naam speler ${i+1}">
      <div class="seg" role="group" aria-label="Mens of computer"><button data-sact="human" class="${!p.ai?'on':''}" aria-pressed="${!p.ai}">Mens</button><button data-sact="ai" class="${p.ai?'on':''}" aria-pressed="${p.ai}">Computer</button></div>
      ${p.ai?`<select class="inp lvl" id="plvl${i}" data-sact="level" aria-label="Niveau van ${esc(p.name)}">${Object.keys(LEVELS).map(l=>`<option value="${l}" ${p.level===l?'selected':''}>${LEVELS[l]}</option>`).join('')}</select>`:'<span class="lvl"></span>'}
      ${P.length>2?`<button class="iconbtn rm" data-sact="remove" aria-label="Verwijder ${esc(p.name)}">✕</button>`:'<span class="rm"></span>'}
    </div>`).join('')}</div>
    ${P.length<6?`<button class="btn" data-sact="add" style="justify-self:start">+ Speler toevoegen</button>`:''}`;
  const s=setup.settings;
  const sw=(id,label,desc,val)=>`<div class="setrow"><label for="${id}">${label}<span>${desc}</span></label><input type="checkbox" class="switch" id="${id}" ${val?'checked':''}></div>`;
  const settingsHTML=`<div>
    <div class="setrow"><label for="sMoney">Startbedrag<span>Officieel ${fmt(1500)}</span></label><input class="inp num" type="number" id="sMoney" min="500" max="5000" step="100" value="${s.startMoney}"></div>
    ${sw('sAuct','Veilingen','Officiële regel: een geweigerd eigendom wordt geveild',s.auctions)}
    ${sw('sPot','Vrij Parkeren-pot','Huisregel: belastingen en boetes gaan naar een pot',s.pot)}
    ${sw('sDouble','Dubbel geld op Start','Huisregel: €400 als je precies op Start landt',s.doubleGo)}
    <div class="setrow"><label for="sTime">Tijdslimiet<span>Bij afloop wint het hoogste vermogen</span></label><select class="inp" id="sTime">${[0,30,60,90].map(v=>`<option value="${v}" ${s.timeLimit===v?'selected':''}>${v?v+' minuten':'Uit'}</option>`).join('')}</select></div>
    <div class="setrow"><label for="sAnim">Animaties<span>Beperkt of uit voor sneller spelen</span></label><select class="inp" id="sAnim">${['volledig','beperkt','uit'].map(v=>`<option value="${v}" ${s.anim===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></div>
    ${sw('sSound','Geluid','Zachte geluidjes bij gooien en kopen',s.sound)}
    ${sw('sHints','Hulp-hints','Tips op het juiste moment',s.hints)}
  </div>`;
  $('#setup').innerHTML=`
    <div class="hero">
      <div class="hero-txt"><p class="eyebrow">Het klassieke Nederlandse bordspel</p><h1>${esc(SPELNAAM)}</h1><p class="lede">Koop straten van de Dorpsstraat tot de Kalverstraat, bouw huizen en hotels en laat je tegenspelers huur betalen.</p>
      <div class="strip8" aria-hidden="true">${Object.keys(GROUPS).map(g=>`<i style="background:${gcol(g)}"></i>`).join('')}</div></div>
      <div class="fdecks" aria-hidden="true">${fdeed('oranje','Neude','Utrecht',180,14)}${fdeed('rood','Heerestraat','Groningen',240,20)}${fdeed('donkerblauw','Kalverstraat','Amsterdam',400,50)}</div>
    </div>
    <div class="modes" role="group" aria-label="Kies een speelmodus">
      <button class="mode ${setup.mode==='samen'?'sel':''}" data-mode="samen" aria-pressed="${setup.mode==='samen'}"><span class="mi">${icon('people')}</span><h3>Samen spelen</h3><p>Speel met 2 tot 6 personen op dit apparaat. Geef het scherm door als je beurt voorbij is.</p></button>
      <button class="mode ${setup.mode==='computer'?'sel':''}" data-mode="computer" aria-pressed="${setup.mode==='computer'}"><span class="mi">${icon('cpu')}</span><h3>Tegen de computer</h3><p>Speel alleen tegen 1 tot 5 computerspelers, op makkelijk, normaal of moeilijk.</p></button>
    </div>
    <div class="links">${saved&&!saved.over?`<button class="btn primary" data-sact="resume">Doorgaan met vorig spel</button>`:''}<button class="btn" data-sact="rules">${icon('help')}Spelregels</button><button class="btn" data-sact="theme">${icon('theme')}Thema</button></div>
    ${setup.mode?`<section class="config" id="config">
      <div class="tabs" role="tablist"><button role="tab" aria-selected="${setup.tab==='spelers'}" class="${setup.tab==='spelers'?'on':''}" data-tab="spelers">Spelers</button><button role="tab" aria-selected="${setup.tab==='inst'}" class="${setup.tab==='inst'?'on':''}" data-tab="inst">Instellingen</button></div>
      ${setup.tab==='spelers'?playersHTML:settingsHTML}
      <div class="cfg-foot"><p class="muted">${nH} ${nH===1?'mens':'mensen'}${nA?` en ${nA} computer${nA===1?'speler':'spelers'}`:''} · ${fmt(s.startMoney)} startgeld</p><button class="btn primary big" data-sact="start">${icon('dice')}Start spel</button></div>
    </section>`:''}`;
}
function freeAIName(){ const used=new Set(setup.players.map(p=>p.name)); return AI_NAMES.find(n=>!used.has(n))||'Computer'; }
function initSetupEvents(){
  const el=$('#setup');
  el.addEventListener('click',e=>{
    const m=e.target.closest('[data-mode]');
    if(m){ if(setup.mode!==m.dataset.mode){ setup.mode=m.dataset.mode; setup.players=defaultPlayers(setup.mode); setup.tab='spelers'; } renderSetup(); const c=$('#config'); if(c) c.scrollIntoView({behavior:RM.matches?'auto':'smooth',block:'nearest'}); return; }
    const t=e.target.closest('[data-tab]');
    if(t){ setup.tab=t.dataset.tab; renderSetup(); return; }
    const b=e.target.closest('[data-sact]'); if(!b) return;
    const row=b.closest('.prow'), i=row?+row.dataset.i:-1, p=setup.players[i];
    switch(b.dataset.sact){
      case 'token':{ const used=new Set(setup.players.filter((_,k)=>k!==i).map(x=>x.token)); let k=TOKENS.indexOf(p.token); do{ k=(k+1)%TOKENS.length; }while(used.has(TOKENS[k])); p.token=TOKENS[k]; renderSetup(); $$('.pawnbtn')[i].focus(); break; }
      case 'human': if(p.ai){ p.ai=false; if(AI_NAMES.includes(p.name)) p.name='Speler '+(i+1); renderSetup(); } break;
      case 'ai': if(!p.ai){ p.ai=true; if(/^Speler \d$|^Jij$/.test(p.name)) p.name=freeAIName(); renderSetup(); } break;
      case 'remove': setup.players.splice(i,1); renderSetup(); break;
      case 'add':{ const used=new Set(setup.players.map(x=>x.token)); const tok=TOKENS.find(x=>!used.has(x)); const ai=setup.mode==='computer'; setup.players.push({name:ai?freeAIName():'Speler '+(setup.players.length+1),token:tok,ai,level:'normaal'}); renderSetup(); break; }
      case 'start': startGame(); break;
      case 'resume': { const s=store.get(SAVE_KEY); if(s) resumeGame(s); break; }
      case 'rules': S=S||null; openModal(2,{html:rulesHTML(),cls:'wide',dismiss:true}); break;
      case 'theme': toggleTheme(); break;
    }
  });
  el.addEventListener('input',e=>{ const t=e.target; if(t.dataset.sact==='name'){ setup.players[+t.closest('.prow').dataset.i].name=t.value; } });
  el.addEventListener('change',e=>{
    const t=e.target, s=setup.settings;
    if(t.dataset.sact==='level'){ setup.players[+t.closest('.prow').dataset.i].level=t.value; return; }
    if(t.id==='sMoney') s.startMoney=Math.min(5000,Math.max(500,Math.round((+t.value||1500)/100)*100));
    if(t.id==='sAuct') s.auctions=t.checked; if(t.id==='sPot') s.pot=t.checked; if(t.id==='sDouble') s.doubleGo=t.checked;
    if(t.id==='sTime') s.timeLimit=+t.value; if(t.id==='sAnim') s.anim=t.value; if(t.id==='sSound') s.sound=t.checked; if(t.id==='sHints') s.hints=t.checked;
    prefs.settings={...s}; store.set(PREF_KEY,prefs);
    if(t.id==='sMoney') renderSetup();
  });
}
async function startGame(){
  if(setup.players.length<2){ toast('Je hebt minimaal 2 spelers nodig'); return; }
  const cfg=setup.players.map((p,i)=>({...p,name:(p.name||'').trim()||(p.ai?AI_NAMES[i%5]:'Speler '+(i+1)),color:PCOLORS[i]}));
  const rows=cfg.map(p=>{ const a=d6(), b=d6(); return {p,a,b,t:a+b,r:Math.random()}; });
  const sorted=[...rows].sort((x,y)=>y.t-x.t||y.r-x.r);
  const md=n=>`<span class="mdie">${dieHTML(n)}</span>`;
  await openModal(1,{html:`<p class="eyebrow">Beurtvolgorde</p><h2>Wie begint?</h2><p class="muted">Iedereen gooit één keer. De hoogste worp begint.</p>
    <ol class="order">${sorted.map((r,k)=>`<li style="--d:${(k*.12).toFixed(2)}s"><span class="rk">${k+1}</span>${pawnSVG(r.p.token,r.p.color)}<span>${esc(r.p.name)}</span><span class="mdice">${md(r.a)}${md(r.b)}</span><b>${r.t}</b></li>`).join('')}</ol>
    <div class="btns"><button class="btn primary big" data-v="ok">${esc(sorted[0].p.name)} begint</button></div>`});
  const players=sorted.map(r=>r.p), settings={...setup.settings};
  UI.gen++;
  S={v:1,mode:setup.mode,settings,players:players.map((p,i)=>({id:i,name:p.name,token:p.token,color:p.color,ai:!!p.ai,level:p.level||'normaal',money:settings.startMoney,pos:0,inJail:false,jailTurns:0,bankrupt:false,bankruptAt:0,stats:{rent:0,jail:0},tradeCd:{}})),
    props:{},houses:32,hotels:12,decks:{chance:shuffle(CHANCE.map((_,i)=>i)),chest:shuffle(CHEST.map((_,i)=>i))},jailCards:{chance:null,chest:null},
    cur:0,phase:'preroll',doubles:0,dice:[3,4],pot:0,log:[],turn:1,elapsedMs:0,over:false};
  OWNABLE.forEach(i=>{ S.props[i]={owner:null,houses:0,mort:false}; });
  showGame();
  log(`Het spel begint. ${S.players[0].name} mag als eerste gooien.`);
  UI.holder=null;
  gameLoop();
}
function showGame(){
  $('#setup').hidden=true; $('#game').hidden=false;
  UI.wait=null; UI.undo=[]; UI.shown={}; UI.managing=false; UI.logFilter='all';
  $('#brandName').textContent=SPELNAAM;
  buildBoard(); buildPlayers();
  sizeBoard(); renderDice(false); render();
  requestAnimationFrame(()=>{ sizeBoard(); render(); });
  window.scrollTo(0,0);
}
function resumeGame(data){
  UI.gen++; S=data; UI.holder=null;
  showGame(); log('Spel hervat'); gameLoop();
}
function quitToSetup(){
  UI.gen++; UI.wait=null; dropModals(); save();
  S=null; UI.lastSave=null;
  $('#game').hidden=true; $('#setup').hidden=false;
  renderSetup(); window.scrollTo(0,0);
}

/* ================= Opstarten ================= */
function initGameUI(){
  $('#actions').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; if(b.classList.contains('is-disabled')){ toast(b.dataset.why); return; } doAction(b.dataset.a); });
  $('#logFilter').addEventListener('change',e=>{ UI.logFilter=e.target.value; renderLog(); });
  $('#bFast').onclick=()=>{ UI.fast=!UI.fast; renderTop(); toast(UI.fast?'Computerbeurten versneld':'Normale snelheid'); };
  $('#bPause').onclick=()=>{ UI.paused=!UI.paused; render(); toast(UI.paused?'Spel gepauzeerd':'Spel hervat'); };
  $('#bSound').onclick=()=>{ S.settings.sound=!S.settings.sound; renderTop(); sfx('coin'); save(); };
  $('#bTheme').innerHTML=icon('theme'); $('#bTheme').setAttribute('aria-label','Wissel thema'); $('#bTheme').onclick=toggleTheme;
  $('#bRules').innerHTML=icon('help'); $('#bRules').setAttribute('aria-label','Spelregels'); $('#bRules').onclick=openRules;
  $('#bMenu').innerHTML=icon('menu'); $('#bMenu').setAttribute('aria-label','Menu'); $('#bMenu').onclick=openMenu;
  let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(sizeBoard,80); });
  setInterval(()=>{ if(S&&!S.over&&!$('#game').hidden&&!UI.paused&&document.visibilityState!=='hidden'){ S.elapsedMs+=1000; renderTimer(); } },1000);
}
function boot(data){
  applyTheme(); initModals(); initGameUI(); initSetupEvents();
  if(data&&data.save){ try{ const s=JSON.parse(data.save); if(s&&!s.over){ resumeGame(s); return; } }catch(e){} }
  renderSetup();
}
window.__stratenspel={get S(){return S;},UI,setup,render};
try{ if(window.claude&&window.claude.hot&&window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({save:UI.lastSave||null})); }catch(e){}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready) hot.ready(boot); else boot((hot&&hot.data)||{});
})();
</script>
